[project]
name = "xhs-core"
version = "3.0.0"
description = "xhs-downloader 领域模型与应用用例"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_core"]
