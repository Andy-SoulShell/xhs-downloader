[project]
name = "xhs-sdk"
version = "3.0.0"
description = "xhs-downloader Python 异步客户端"
requires-python = ">=3.12"
dependencies = [
    "xhs-adapters",
    "xhs-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_sdk"]

[tool.uv.sources]
xhs-adapters = { workspace = true }
xhs-core = { workspace = true }
