[project]
name = "xhs-cli"
version = "3.0.0"
description = "xhs-downloader 命令行应用"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.21.0",
    "xhs-adapters",
    "xhs-core",
]

[project.scripts]
xhs-downloader = "xhs_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_cli"]

[tool.uv.sources]
xhs-adapters = { workspace = true }
xhs-core = { workspace = true }
