[tool.uv.workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/mcp",
    "packages/xhs-adapters",
    "packages/xhs-core",
    "packages/xhs-sdk",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.uv.pip]
index-url = "https://mirrors.ustc.edu.cn/pypi/simple"

[tool.pytest.ini_options]
addopts = "--cov=xhs_core --cov=xhs_adapters --cov=xhs_api --cov=xhs_mcp --cov=xhs_cli --cov=xhs_sdk --cov-branch --cov-report=term-missing --cov-fail-under=85 -q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "coverage",
    "dist",
    "node_modules",
]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "D"]
ignore = [
    "D105",
    "D107",
    # pydocstyle 暂不识别中文句末标点。
    "D415",
    # 中文标点是用户文案与中文 docstring 的必要组成部分。
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
